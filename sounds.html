<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#eef3f8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%233fa7d6'/%3E%3Cpath d='M11 12h4l5-4v16l-5-4h-4z' fill='%23fff'/%3E%3C/svg%3E" />
    <title>おと確認 — ワンダー号とふしぎな世界</title>
    <style>
      :root { color: #172033; background: #eef3f8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: max(12px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
      header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
      h1 { font-size: 24px; margin: 4px 0 8px; }
      h2 { font-size: 17px; margin: 22px 0 8px; color: #405066; }
      .build { margin-left: auto; color: #8a97a8; font-size: 12px; }
      .note { color: #607086; font-size: 14px; margin: 0 0 6px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; }
      button {
        min-height: 48px; padding: 10px 16px; border-radius: 999px; border: 1px solid #c9d4e0;
        background: #fff; color: #172033; font-size: 16px; font-family: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      button:active { transform: scale(0.97); }
      button[aria-pressed="true"] { background: #254a68; color: #fff; border-color: #254a68; }
      #run { background: #fff; border-radius: 18px; padding: 12px 14px 16px; box-shadow: 0 1px 3px rgba(23, 32, 51, 0.08); }
      #meter { display: flex; align-items: center; gap: 12px; margin: 4px 0 10px; font-size: 16px; }
      #bar { flex: 1; height: 12px; border-radius: 6px; background: #e3e9f1; overflow: hidden; }
      #bar > div { height: 100%; width: 0; background: linear-gradient(90deg, #7cc6f2, #ff9f1c); }
      #speed { min-width: 120px; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <header><h1>おと確認</h1><span class="build" id="build"></span></header>
    <p class="note">ボタンを おすと その おとが なります。はじめの 1 かいは おとが でるまで すこし かかります。</p>
    <section id="run">
      <h2>はしる おと</h2>
      <div id="meter"><span id="speed">とまっている</span><div id="bar"><div></div></div></div>
      <div class="row" id="notches"></div>
      <h2>レールの しゅるい</h2>
      <div class="row" id="surfaces"></div>
      <h2>そのほか</h2>
      <div class="row"><button type="button" id="hop">ジャンプ（そらを とぶ）</button></div>
    </section>
    <div id="effects"></div>
    <script type="module" src="/src/viewer/sounds.ts"></script>
  </body>
</html>
