<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#eef3f8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='6' width='24' height='18' rx='5' fill='%233fa7d6'/%3E%3Crect x='8' y='10' width='16' height='6' rx='2' fill='%231f2a44'/%3E%3Ccircle cx='10' cy='27' r='3' fill='%233a3f47'/%3E%3Ccircle cx='22' cy='27' r='3' fill='%233a3f47'/%3E%3C/svg%3E" />
    <title>モデル確認 — ワンダー号とふしぎな世界</title>
    <style>
      :root { color: #172033; background: #eef3f8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #info {
        position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px;
        display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
        pointer-events: none; font-size: 15px;
      }
      #info strong { font-size: 22px; }
      #info code { color: #607086; font-size: 13px; }
      #info .build { margin-left: auto; color: #8a97a8; font-size: 12px; }
      #list {
        position: fixed; left: 0; right: 0; bottom: 0;
        padding: 10px 12px max(12px, env(safe-area-inset-bottom));
        display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
        background: linear-gradient(to top, rgba(238,243,248,.98), rgba(238,243,248,.6));
      }
      #list button {
        flex: 0 0 auto; padding: 10px 14px; border-radius: 999px; border: 1px solid #c9d4e0;
        background: #fff; color: #172033; font-size: 15px; font-family: inherit;
      }
      #list button.group { background: transparent; border: none; color: #607086; font-size: 12px; padding: 10px 4px 10px 8px; }
      #list button[aria-pressed="true"] { background: #254a68; color: #fff; border-color: #254a68; }
      #hint { position: fixed; right: 12px; bottom: 76px; font-size: 12px; color: #8a97a8; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="info"><strong id="name">…</strong><code id="dims"></code><span class="build" id="build"></span></div>
    <div id="hint">ドラッグで回す・ピンチで寄る</div>
    <div id="list"></div>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
