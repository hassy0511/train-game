name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the change can be compared with main (scripts/select-smoke.mjs).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Every stage's full run on main (before a deploy) or with "[full]" in the PR title; otherwise the quick specs
      # and the full runs of the stages the change touches (everything when shared code changed).
      - id: pick
        run: echo "specs=$(node scripts/select-smoke.mjs origin/main)" >> "$GITHUB_OUTPUT"
        env:
          FULL: ${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || contains(github.event.pull_request.title, '[full]') }}
      - run: npx playwright test -c tests/smoke/playwright.config.ts ${{ steps.pick.outputs.specs }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: tests/smoke/output/*.png
          if-no-files-found: warn

  deploy:
    needs: smoke
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /train-game/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
