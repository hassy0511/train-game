silhouette_features:
  - broad faceted head with fuller back and a short forward face
  - narrow neck and tapered pear-shaped torso
  - thin continuous limbs with readable bends but no separate elbow or knee spheres
  - broad rounded feet with shallow toe grooves
  - left arm relaxed downward
  - right forearm raised with one index finger pointing upward
  - curved cyan lamp stalk with a thick gold rim and cream center

style:
  low_poly_planes: controlled
  angular_vs_round: rounded main masses tightened by visible low-poly planes and tapers
  smoothing_notes: watertight voxel-unioned skin with smooth anatomical transitions; graphic face elements conform to the head surface

uncertain_or_inferred:
  - exact underside of feet is inferred and kept flat for grounding
  - rear torso seam and hidden hand surfaces are inferred from the three-view design

critical_do_not_change:
  - cyan, warm cream, dark brown, and gold palette
  - face-surface eyes that do not protrude in profile
  - visible cream neck and belly patch
  - head lamp silhouette
  - slim body and limbs; do not restore the old 0.60 m width or 0.50 m depth
